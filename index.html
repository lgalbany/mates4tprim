65px;z-index:2}.cloud{position:absolute;top:15px;font-size:50px;left:40px}.sun{position:absolute;right:35px;top:20px;font-size:45px}.path{position:absolute;bottom:40px;z-index:3;left:40%;font-size:40px}.sectionline{display:flex;align-items:end;justify-content:space-between;margin:20px 0}.sectionline p{margin:0;color:#63786f;font-size:14px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{padding:24px;background:white;border:1px solid #dce4d9;border-radius:22px;text-align:left;position:relative;color:var(--ink);box-shadow:0 4px 0 #e8ebdf;transition:transform .2s}.card:hover{transform:translateY(-4px)}.card .icon{width:58px;height:58px;display:grid;place-items:center;font-size:32px;border-radius:18px;background:var(--tint)}.card h3{font-size:22px;margin:17px 0 8px}.card p{font-size:14px;color:#63786f;min-height:42px;margin:0 0 18px}.card .tag{font-size:12px;font-weight:bold;color:var(--green)}.arrow{position:absolute;right:22px;bottom:20px;font-size:24px}.progress{height:6px;border-radius:8px;background:#edf0e7;margin:18px 0 10px;overflow:hidden}.progress i{display:block;height:100%;background:#75ac6a}.back{background:transparent;border:0;color:var(--green);padding:10px 0;margin-bottom:18px}.play{max-width:760px;margin:auto}.panel{background:white;border:1px solid #dce4d9;border-radius:26px;padding:32px}.question{font-size:26px;line-height:1.35;margin:25px 0}.visual{padding:22px;background:#f1f5e9;border-radius:16px;text-align:center;font-size:32px;letter-spacing:4px;white-space:pre-line}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:25px 0}.answer{padding:19px;border:2px solid #dce4d9;border-radius:14px;background:#fffdf7;color:var(--ink);font-size:20px;font-weight:600}.answer:hover{border-color:var(--green);background:#eef7ee}.answer:disabled{cursor:default;opacity:.65}.answer.correct{background:#dcefd6;border-color:#5a974d;opacity:1}.answer.wrong{background:#fff0e1;border-color:#d5934d}.hint{border:0;background:#fff0b9;padding:12px 18px;border-radius:12px;color:#6b541c}.feedback{padding:16px;border-radius:14px;background:#eef5e7;line-height:1.6;margin:18px 0}.muted{color:#63786f;font-size:14px}.reward{text-align:center;padding:20px}.reward .big{font-size:85px}.pills{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.pill{padding:10px 16px;border:1px solid #cddcca;border-radius:30px;background:white;color:var(--green)}.pill.active{background:var(--green);color:white}table{border-collapse:collapse;width:100%;font-size:14px}td,th{padding:13px 8px;border-bottom:1px solid #e2e8dd;text-align:left}footer{text-align:center;font-size:12px;color:#74877a;padding:20px}a{color:var(--green)}@media(max-width:700px){header{padding:15px 20px;gap:10px;flex-wrap:wrap}#brand{font-size:20px}nav{order:3;width:100%;margin:0;justify-content:center}#stars{margin-left:auto}main{padding:30px 18px}.hero{grid-template-columns:1fr;gap:20px}.island{height:220px}.grid{grid-template-columns:1fr 1fr}.card{padding:18px}.card h3{font-size:19px}.sectionline{display:block}.panel{padding:22px}.question{font-size:23px}.visual{font-size:25px}}@media(max-width:420px){.grid{grid-template-columns:1fr}.answers{grid-template-columns:1fr 1fr}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><body><header><a href="#" id="brand">✳ L’illa dels reptes</a><nav><button id="mapnav">El mapa</button><button id="collection">Els meus tresors</button><button id="adults">Per als grans</button></nav><span id="stars">⭐ 0</span></header><main id="main"></main><footer>Fet per descobrir, provar i aprendre. · Matemàtiques de 4t de primària</footer><script>const zones=[
{title:'El bosc dels nombres',icon:'🌳',tint:'#e6efce',desc:'Descobreix nombres i obre cofres secrets.',topics:'Numeració · Càlcul mental',treasure:'🌱',q:[
['El cofre s’obre amb 3 milers, 4 centenes i 2 unitats. Quin és el codi?',['3.402','3.042','3.420','4.302'],0,'3.000 + 400 + 2 = 3.402.','Col·loca cada xifra al seu lloc: milers, centenes, desenes i unitats.','UM  C  D  U\n3    4   0   2'],
['Quin nombre és just al mig entre 2.990 i 3.010?',['2.900','3.000','3.100','2.999'],1,'3.000 és més gran que 2.990 i més petit que 3.010.','Busca un nombre que compleixi les dues condicions.','2.990 ← ? → 3.010'],
['Hi ha 198 llavors. Aproximadament, quantes n’hi ha si arrodonim a la centena?',['100','190','200','300'],2,'198 és a només 2 de 200. Per això arrodonim a 200.','Compara la distància fins a 100 i fins a 200.','🌱 198'],
['La guineu té 250 nous i en troba 75. Quantes en té ara?',['325','275','225','350'],0,'250 + 50 = 300; 300 + 25 = 325.','Descompon 75 en 50 i 25.','250 + 75 = ?'],
['Quin nombre és el més gran?',['4.099','4.909','4.990','4.900'],2,'Tots tenen 4 milers. Compara després les centenes i les desenes.','Comença per l’esquerra i compara les xifres.','🔎 4 milers']
]},
{title:'El mercat de la plaça',icon:'🛒',tint:'#ffecd3',desc:'Compra provisions i reparteix els tresors.',topics:'Operacions · Diners',treasure:'🧺',q:[
['Compres una llibreta de 3 € i un llapis de 2 €. Pagues amb 10 €. Quin canvi reps?',['3 €','7 €','5 €','2 €'],2,'La compra costa 3 + 2 = 5 €. El canvi és 10 − 5 = 5 €.','Primer suma el preu dels dos objectes.','📒 3 €   ✏️ 2 €'],
['Hi ha 6 cistells amb 4 pomes cadascun. Quantes pomes hi ha?',['10','24','20','28'],1,'6 grups de 4 són 6 × 4 = 24 pomes.','Pots sumar 4 sis vegades.','🍎🍎🍎🍎\n🍎🍎🍎🍎\n… 6 cistells'],
['Reparteixes 32 maduixes entre 4 amigues, a parts iguals. Quantes en rep cadascuna?',['6','7','9','8'],3,'32 ÷ 4 = 8. Ho comprovem: 4 × 8 = 32.','Busca quin nombre multiplicat per 4 dona 32.','🍓 32 → 👧 👧 👧 👧'],
['Una ampolla costa 1 € i 50 cèntims. Quant costen dues ampolles?',['2 €','3 €','2,50 €','3,50 €'],1,'1,50 € + 1,50 € = 3 €. Dos grups de 50 cèntims fan 1 €.','Suma els euros i després els cèntims.','🧴 1,50 € + 🧴 1,50 €'],
['Tens 50 €. Compres 3 entrades de 8 €. Quants diners et queden?',['26 €','24 €','42 €','34 €'],0,'3 × 8 = 24 €. Després: 50 − 24 = 26 €.','Calcula primer el preu de les tres entrades.','🎟️ 8 €   🎟️ 8 €   🎟️ 8 €']
]},
{title:'La cuina de les fraccions',icon:'🍕',tint:'#ffe2d9',desc:'Una recepta deliciosa per aprendre a repartir.',topics:'Fraccions · Parts iguals',treasure:'🍰',q:[
['Una pizza està tallada en 4 parts iguals. N’agafes una. Quina fracció tens?',['1/2','1/4','3/4','4/4'],1,'Una part de quatre parts iguals és un quart: 1/4.','El nombre de sota indica en quantes parts iguals tallem el total.','🟧⬜\n⬜⬜'],
['Quantes peces d’un quart necessites per fer mitja pizza?',['1','3','2','4'],2,'Dos quarts equivalen a una meitat: 2/4 = 1/2.','Dibuixa una pizza de quatre peces i marca’n la meitat.','🟧🟧\n⬜⬜'],
['Quina quantitat és més gran, en dos pastissos de la mateixa mida?',['1/4','1/2','Són iguals','No es pot saber'],1,'La meitat és més gran que un quart si el total és el mateix.','Si reparteixes el mateix pastís entre menys persones, cada tros és més gran.','½   ?   ¼'],
['Hi ha 12 galetes. En dones un terç a la teva amiga. Quantes li dones?',['3','6','4','9'],2,'Un terç de 12 és 12 ÷ 3 = 4 galetes.','Reparteix les 12 galetes en tres grups iguals.','🍪🍪🍪🍪\n🍪🍪🍪🍪\n🍪🍪🍪🍪'],
['Tens 8 trossos iguals de pastís i en menges 3. Quina fracció queda?',['3/8','5/8','5/3','8/5'],1,'Queden 8 − 3 = 5 peces de les 8 inicials: 5/8.','El nombre total de parts iguals continua sent 8.','⬜⬜⬜🟧🟧🟧🟧🟧']
]},
{title:'L’estació del temps',icon:'⏰',tint:'#fff1c6',desc:'Rellotges, viatges i mesures per explorar.',topics:'Temps · Longitud · Capacitat',treasure:'🧭',q:[
['El tren surt a les 10:20 i el viatge dura 30 minuts. A quina hora arriba?',['10:40','11:20','10:50','11:00'],2,'20 minuts + 30 minuts = 50 minuts. Arriba a les 10:50.','Afegeix tres salts de deu minuts.','🚂 10:20 → +30 min'],
['Quants centímetres són 2 metres?',['20','200','2.000','12'],1,'1 metre són 100 centímetres; 2 metres són 200 centímetres.','Cada metre conté 100 centímetres.','📏 1 m = 100 cm'],
['Quina unitat triaries per mesurar l’aigua d’una ampolla?',['Quilograms','Metres','Litres','Hores'],2,'Els litres mesuren capacitat: quant líquid hi cap.','Pensa què mesura cada unitat: massa, longitud, capacitat o temps.','💧 🧴'],
['El rellotge digital marca les 16:00. Quina hora és a la tarda?',['Les 6','Les 4','Les 5','Les 3'],1,'16 − 12 = 4. Són les 4 de la tarda.','En el format de 24 hores, després de les 12 continuem amb 13, 14…','🕓 16:00'],
['Una recepta necessita 1 kg de farina. Ja hi has posat 750 g. Quants grams falten?',['150 g','250 g','350 g','750 g'],1,'1 kg = 1.000 g. Falten 1.000 − 750 = 250 g.','Expressa primer el quilogram en grams.','⚖️ 750 g + ? = 1 kg']
]},
{title:'El castell de les formes',icon:'🏰',tint:'#e9e1f5',desc:'Construeix, gira i descobreix formes amagades.',topics:'Geometria · Simetria · Perímetre',treasure:'🏰',q:[
['Quina figura té 3 costats i 3 vèrtexs?',['Quadrat','Triangle','Pentàgon','Cercle'],1,'Un triangle té tres costats i tres vèrtexs.','El seu nom comença amb «tri», que vol dir tres.','△'],
['Un jardí rectangular fa 6 m de llarg i 4 m d’ample. Quant mesura tota la tanca?',['10 m','24 m','20 m','16 m'],2,'Sumem els quatre costats: 6 + 4 + 6 + 4 = 20 metres.','El perímetre és la longitud de tot el contorn.','▭\n6 m × 4 m'],
['Quin cos té 6 cares quadrades iguals?',['Cilindre','Con','Esfera','Cub'],3,'Un cub té 6 cares; totes són quadrats iguals.','Pensa en la forma d’un dau.','🎲'],
['Fas un quart de volta. Quin angle has girat?',['45°','90°','180°','360°'],1,'Una volta sencera té 360°. Un quart és 360 ÷ 4 = 90°.','Un quart de volta forma un angle recte.','↑ →'],
['Quants eixos de simetria té un quadrat?',['1','2','3','4'],3,'En té 4: un de vertical, un d’horitzontal i les dues diagonals.','Imagina per on el podries plegar perquè les dues meitats coincidissin.','□']
]},
{title:'El laboratori del robot',icon:'🤖',tint:'#dceef3',desc:'Desxifra patrons i programa una expedició.',topics:'Patrons · Lògica · Instruccions',treasure:'🤖',q:[
['Quin nombre segueix aquesta sèrie?',['16','18','20','22'],2,'Cada vegada sumem 4: 4, 8, 12, 16, 20.','Compara dos nombres consecutius.','4 → 8 → 12 → 16 → ?'],
['Quin nombre falta perquè la igualtat sigui certa?',['7','8','9','10'],2,'9 + 7 = 16. També ho pots trobar fent 16 − 7 = 9.','Les dues bandes del signe igual han de tenir el mateix valor.','□ + 7 = 16'],
['El robot camina 2 passes i ho repeteix 3 vegades. Quantes passes fa?',['5','6','8','9'],1,'2 + 2 + 2 = 6 passes. És el mateix que 3 × 2.','Repeteix la mateixa instrucció tres cops.','🤖 [→ →] × 3'],
['Quina peça continua el patró?',['🟡','🔵','🔺','🟩'],1,'Es repeteix el grup blau, blau, groc. El grup següent comença amb blau.','Busca el grup més petit que es repeteix.','🔵 🔵 🟡 🔵 🔵 🟡 ?'],
['Quina expressió té el mateix valor que 4 × 6?',['4 + 6','6 + 6 + 6 + 6','4 + 4 + 4','6 × 6'],1,'4 × 6 representa quatre grups de sis: 6 + 6 + 6 + 6 = 24.','Busca quatre grups amb sis elements cadascun.','4 × 6 = ?']
]},
{title:'L’observatori dels animals',icon:'🦉',tint:'#e2eddf',desc:'Investiga dades i fes descobertes sorprenents.',topics:'Gràfics · Dades · Atzar',treasure:'🔭',q:[
['Quants ocells més que conills s’han vist?',['1','2','3','4'],1,'S’han vist 5 ocells i 3 conills. La diferència és 5 − 3 = 2.','Compta les barres i compara les quantitats.','Ocells   ▰▰▰▰▰\nConills  ▰▰▰\nCada ▰ = 1 animal'],
['Quants animals s’han vist en total?',['8','9','10','11'],2,'4 + 2 + 4 = 10 animals.','Suma les tres quantitats de la taula.','🦋 4   🐞 2   🐝 4'],
['Una bossa només té fitxes verdes. Treure’n una de vermella és…',['Segur','Molt probable','Impossible','Igual de probable'],2,'És impossible: a la bossa no hi ha cap fitxa vermella.','Mira quins colors hi ha dins la bossa.','🟢 🟢 🟢 🟢'],
['Hi ha 5 fitxes blaves i 1 de groga. Sense mirar, quin color és més probable treure?',['Groc','Blau','Tots dos igual','No en sortirà cap'],1,'És més probable treure blau perquè n’hi ha més fitxes. Tot i així, també pot sortir groc.','Compara quantes fitxes hi ha de cada color.','🔵 🔵 🔵 🔵 🔵 🟡'],
['Quina pregunta ens serveix per investigar el transport de la classe?',['Quin color t’agrada?','Com vens a l’escola?','Quants anys tens?','Què has esmorzat?'],1,'Preguntar com venim a l’escola ens permet recollir dades sobre el transport.','La pregunta ha d’estar relacionada amb allò que volem investigar.','🚶 🚲 🚌 🚗']
]}];
let state;try{state=JSON.parse(localStorage.getItem('illa-mates-v1'))||{done:{},attempts:{}}}catch{state={done:{},attempts:{}}}state.done ||= {};state.attempts ||= {};let active=0,step=0,round=[],solved=false;const main=document.querySelector('main');const key=(z,q)=>`${z}-${q}`;const completed=z=>zones[z].q.filter((_,q)=>state.done[key(z,q)]).length;const total=()=>Object.keys(state.done).length;function save(){try{localStorage.setItem('illa-mates-v1',JSON.stringify(state))}catch{}document.querySelector('#stars').textContent=`⭐ ${total()}`}
function home(){save();main.innerHTML=`<section class="hero"><div><span class="eyebrow">LA TEVA AVENTURA MATEMÀTICA · 4T</span><h1>Una illa plena<br>de descobertes.</h1><p>Explora, resol petits reptes i omple l’illa de tresors. La teva pròxima descoberta comença aquí!</p><button class="primary" id="start">Som-hi! Explorem l’illa ↗</button><div class="sub">🌿 Al teu ritme · Amb pistes · Sense presses</div></div><div class="island" role="img" aria-label="Illa amb muntanyes, arbres i un castell"><div class="land"></div><span class="cloud">☁️</span><span class="sun">☀️</span><span class="mount">⛰️</span><span class="tree">🌳</span><span class="house">🏰</span><span class="path">👣</span></div></section><div class="sectionline"><div><span class="eyebrow">TRIA EL TEU DESTÍ</span><h2>El mapa de l’aventura</h2></div><p>${total()} de 35 descobertes · Totes les zones són obertes</p></div><section class="grid">${zones.map((z,i)=>`<button class="card" data-zone="${i}" style="--tint:${z.tint}"><span class="icon">${z.icon}</span><h3>${z.title}</h3><p>${z.desc}</p><span class="tag">${z.topics}</span><div class="progress"><i style="width:${completed(i)*20}%"></i></div><span class="muted">${completed(i)}/5 descobertes ${completed(i)===5?'· Tresor aconseguit!':''}</span><span class="arrow">↗</span></button>`).join('')}</section>`;document.querySelector('#start').onclick=()=>start(zones.findIndex((_,i)=>completed(i)<5)===-1?0:zones.findIndex((_,i)=>completed(i)<5));document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>start(+b.dataset.zone));window.scrollTo(0,0)}
function start(z){active=z;step=0;round=zones[z].q.map((_,i)=>i).filter(i=>!state.done[key(z,i)]);if(!round.length)round=zones[z].q.map((_,i)=>i);question()}
function question(){solved=false;const z=zones[active],q=z.q[round[step]];main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><div class="sectionline"><span class="eyebrow">${z.icon} ${z.title}</span><span class="muted">Repte ${step+1} de ${round.length}</span></div><div class="progress"><i style="width:${step/round.length*100}%"></i></div><section class="panel"><span class="eyebrow">OBSERVA · PENSA · PROVA</span><h2 class="question">${q[0]}</h2><div class="visual">${q[5]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-answer="${i}">${a}</button>`).join('')}</div><button class="hint" id="hint">💡 Una pista, si us plau</button><div id="feedback" aria-live="polite"></div><div id="next"></div></section><p class="muted">🌱 Equivocar-se també és descobrir. Pots tornar-ho a provar.</p></div>`;document.querySelector('#hint').onclick=()=>{document.querySelector('#feedback').innerHTML=`<div class="feedback">💡 ${q[4]}</div>`};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,b));window.scrollTo(0,0)}
function answer(a,b){if(solved)return;const id=key(active,round[step]),q=zones[active].q[round[step]];state.attempts[id]=(state.attempts[id]||0)+1;if(a!==q[2]){b.classList.add('wrong');b.disabled=true;document.querySelector('#feedback').innerHTML=`<div class="feedback">Encara no. Provem-ho d’una altra manera: ${q[4]}</div>`;save();return}solved=true;b.classList.add('correct');state.done[id]=true;save();document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);document.querySelector('#hint').hidden=true;document.querySelector('#feedback').innerHTML=`<div class="feedback"><strong>✨ Ho has descobert!</strong><br>${q[3]}</div>`;document.querySelector('#next').innerHTML='<button class="primary" id="continue">Continuem →</button>';document.querySelector('#continue').onclick=()=>{step++;step<round.length?question():finish()}}
function finish(){main.innerHTML=`<div class="play panel reward"><div class="big">${zones[active].treasure}</div><span class="eyebrow">UNA NOVA DESCOBERTA</span><h1>Missió completada!</h1><p>Has explorat ${zones[active].title.toLowerCase()} i has aconseguit un tresor per a la teva illa.</p><p>⭐ Ja tens ${total()} descobertes. Pots descansar o triar una altra aventura.</p><button class="primary" onclick="home()">Tornar a l’illa →</button><p><button class="back" onclick="start(active)">Tornar a practicar aquesta zona</button></p></div>`}
function treasures(){main.innerHTML=`<button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">LA TEVA COL·LECCIÓ</span><h1>Petites grans descobertes.</h1><p>Completa els cinc reptes d’una zona per aconseguir el seu tresor. Cada descobriment compta!</p><div class="grid">${zones.map((z,i)=>`<button class="card" data-zone="${i}" style="--tint:${z.tint}"><span class="icon">${completed(i)===5?z.treasure:'🔎'}</span><h3>${z.title}</h3><p>${completed(i)===5?'Tresor aconseguit! Pots tornar-hi per practicar.':`Ja has fet ${completed(i)} de 5 descobertes.`}</p><span class="tag">${completed(i)===5?'Tornar a jugar':'Continuar explorant'} →</span></button>`).join('')}</div>`;document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>start(+b.dataset.zone))}
function adults(){main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">PER ACOMPANYAR L’AVENTURA</span><h1>Aprendre amb confiança.</h1><div class="panel"><h2>Què estem treballant?</h2><p>Aquesta primera versió conté 35 reptes originals, inspirats en els sabers de matemàtiques de 3r–4t de primària del Departament d’Educació. És una selecció inicial de pràctica, no una cobertura completa del curs ni una prova d’avaluació.</p><p>El sentit socioemocional és transversal: pistes disponibles, nous intents i absència de temps límit. Les estrelles indiquen reptes resolts, també amb ajuda; no certifiquen el domini autònom.</p><table><thead><tr><th>Zona</th><th>Resolts</th><th>Intents</th></tr></thead><tbody>${zones.map((z,i)=>`<tr><td>${z.icon} ${z.title}</td><td>${completed(i)}/5</td><td>${z.q.reduce((s,_,j)=>s+(state.attempts[key(i,j)]||0),0)}</td></tr>`).join('')}</tbody></table><h3>Com acompanyar-la</h3><p>Proposeu una zona en sessions de 5–10 minuts. Demaneu-li que expliqui com ho ha pensat i utilitzeu monedes, paper o peces reals quan li vagi bé. El nombre d’intents inclou les repeticions dels reptes.</p><h3>Fonts oficials</h3><p><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/curriculum-175-2022/Matematiques.pdf" target="_blank" rel="noopener">Currículum de matemàtiques de primària ↗</a><br><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/concrecions-curriculars/Orientacions-curriculars_MAT_PRI_per-cursos.pdf" target="_blank" rel="noopener">Orientacions curriculars: proposta per cursos ↗</a></p><p class="muted">El progrés es guarda només en aquest navegador. No cal nom ni compte. Si canvieu de dispositiu o esborreu les dades del navegador, aquest progrés no hi serà.</p><button class="hint" id="reset">Reiniciar el progrés…</button><div id="reset-confirm"></div></div></div>`;document.querySelector('#reset').onclick=()=>{document.querySelector('#reset-confirm').innerHTML='<p>S’esborraran totes les estrelles i els intents d’aquest navegador.</p><button class="pill" id="yesreset">Sí, esborrar el progrés</button><button class="pill" id="cancelreset">Cancel·lar</button>';document.querySelector('#yesreset').onclick=()=>{state={done:{},attempts:{}};save();adults()};document.querySelector('#cancelreset').onclick=()=>document.querySelector('#reset-confirm').innerHTML=''}}
document.querySelector('#brand').onclick=e=>{e.preventDefault();home()};document.querySelector('#mapnav').onclick=home;document.querySelector('#collection').onclick=treasures;document.querySelector('#adults').onclick=adults;home();
</script></body></html>
