zza sencera tallada en 4 parts?", ["1/4", "4/4", "3/4", "4/1"], 1, "Si agafem les quatre parts de quatre, tenim 4/4: la pizza sencera.", "Agafa totes les parts.", "🍕 4 parts de 4", "Quan numerador i denominador són iguals, representem un enter."], ["Quina fracció és més petita, en barres iguals?", ["3/5", "4/5", "2/5", "1/5"], 3, "Amb parts de la mateixa mida, una part és menys que dues, tres o quatre.", "Totes tenen el mateix denominador.", "1/5 · 2/5 · 3/5 · 4/5", "Amb el mateix denominador, és menor la fracció amb numerador més petit."], ["Un quart de 20 maduixes són…", ["4", "10", "5", "8"], 2, "20 ÷ 4 = 5 maduixes.", "Forma quatre grups iguals.", "🍓 20 → 4 grups", "Per trobar un quart d’una quantitat, la dividim per 4."], ["La meitat de 18 peces són…", ["9", "6", "8", "12"], 0, "18 ÷ 2 = 9 peces.", "Dos grups iguals de quantes peces fan 18?", "18 ÷ 2", "La meitat és una de dues parts iguals."], ["Dos terços de 12 galetes són…", ["4", "6", "8", "10"], 2, "Un terç són 12 ÷ 3 = 4; dos terços són 2 × 4 = 8.", "Troba primer un terç i agafa’n dos grups.", "12 ÷ 3 × 2", "Per trobar diverses parts, calculem una part i la multipliquem pel numerador."], ["Tens 3/4 d’una pizza i n’afegeixes 1/4. Quant en tens?", ["2/4", "4/4", "3/8", "4/8"], 1, "3 quarts + 1 quart = 4 quarts, una pizza sencera.", "Sumem parts de la mateixa mida.", "3/4 + 1/4", "Amb el mateix denominador, sumem els numeradors i mantenim el denominador."], ["De 5/6 d’una barra en menges 2/6. Què queda?", ["7/6", "3/12", "2/6", "3/6"], 3, "5 sisens − 2 sisens = 3 sisens: 3/6.", "Resta les parts menjades de les que tenies.", "5/6 − 2/6", "Amb el mateix denominador, restem els numeradors i mantenim la mida de les parts."], ["Quina fracció equival a 1/2?", ["2/4", "1/4", "3/4", "2/3"], 0, "Si dividim cada meitat en dos, la meitat ocupa 2 de les 4 parts.", "Imagina un rectangle tallat en quatre parts iguals.", "🟧🟧⬜⬜", "Les fraccions equivalents representen la mateixa part d’un mateix total."], ["Quina és més gra const shopMissions=[{items:[['📒 Llibreta',300,1],['✏️ Llapis',150,2]],pay:1000},{items:[['🍎 Poma',75,4],['🥖 Pa',125,2]],pay:1000},{items:[['🧃 Suc',120,3],['🥪 Entrepà',240,2]],pay:2000}];
const money=n=>(n/100).toLocaleString('ca-ES',{minimumFractionDigits:2,maximumFractionDigits:2})+' €';
let counts=[],coins=0,gameSolved=false;
function shop(n){counts=[0,0];coins=0;gameSolved=false;const m=shopMissions[n];main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">🛍️ BOTIGA · MISSIÓ ${n+1}/3</span><h1>Preparem la compra!</h1><section class="panel"><p>La llista: ${m.items.map(i=>`${i[2]} × ${i[0]}`).join(' i ')}. Pagaràs amb <strong>${money(m.pay)}</strong>.</p>${m.items.map((i,j)=>`<div class="pills"><span>${i[0]} · ${money(i[1])}</span><button class="pill" onclick="basket(${j},-1)" aria-label="Treure ${i[0]}">−</button><strong id="count${j}" aria-live="polite">0</strong><button class="pill" onclick="basket(${j},1)" aria-label="Afegir ${i[0]}">+</button></div>`).join('')}<p id="basket-total" aria-live="polite">Cistell: 0,00 €</p><h3>Prepara el canvi que rebràs</h3><p>Toca les monedes per sumar-les.</p><div class="pills">${[500,200,100,50,20,10,5].map(v=>`<button class="pill" onclick="coin(${v})">+ ${money(v)}</button>`).join('')}<button class="pill" onclick="coin(-coins)">Buidar el canvi</button></div><p id="coins" aria-live="polite">Canvi preparat: 0,00 €</p><button class="hint" onclick="document.querySelector('#gamefeedback').textContent='💡 Suma el cost dels productes. Després resta aquest total dels diners amb què pagues.'">Una pista</button><button class="primary" id="checkgame">Comprovar</button><div id="gamefeedback" aria-live="polite"></div></section></div>`;document.querySelector('#checkgame').onclick=()=>{if(gameSolved)return;const cost=m.items.reduce((t,i,j)=>t+i[1]*counts[j],0);if(counts.some((v,j)=>v!==m.items[j][2])){document.querySelector('#gamefeedback').textContent='Mira la llista: comprova quantes unitats necessites de cada producte.';return}if(coins!==m.pay-cost){document.querySelector('#gamefeedback').textContent='El cistell és correcte! Ara revisa el canvi: compra + canvi han de sumar el que pagues.';return}gameSolved=true;state.done['shop-'+n]=true;save();document.querySelector('#gamefeedback').innerHTML=learning('Primer multipliquem el preu per les unitats, sumem la compra i restem per trobar el canvi.',`${m.items.map(i=>`${i[2]} × ${money(i[1])}`).join(' + ')} = ${money(cost)}. Canvi: ${money(m.pay)} − ${money(cost)} = ${money(coins)}.`)+`<button class="primary" onclick="${n<2?'shop('+(n+1)+')':'home()'}">${n<2?'Següent compra →':'Tornar a l’illa →'}</button>`};window.scrollTo(0,0)}
function basket(j,d){if(gameSolved)return;counts[j]=Math.max(0,Math.min(12,counts[j]+d));document.querySelector('#count'+j).textContent=counts[j];document.querySelector('#basket-total').textContent='Cistell: '+money(shopMissions[currentShop()].items.reduce((t,i,k)=>t+i[1]*counts[k],0))}
let shopIndex=0;const originalShop=shop;shop=function(n){shopIndex=n;originalShop(n)};function currentShop(){return shopIndex}

const puzzles=[{title:'El mirall del mosaic',text:'La línia central és un mirall. Pinta les caselles de la dreta perquè coincideixin amb les de l’esquerra.',cols:4,rows:4,fixed:[0,5,8,9,13],target:[3,6,10,11,14],rule:'En una simetria, cada peça queda a la mateixa distància de l’eix, a l’altra banda.',example:'La primera columna es reflecteix a la quarta; la segona, a la tercera.'},{title:'Un jardí rectangular',text:'Pinta un rectangle de 3 columnes i 2 files, en qualsevol lloc del tauler. Totes les caselles han d’estar juntes.',cols:4,rows:4,rule:'Un rectangle té quatre angles rectes. Les files i columnes ens ajuden a comptar-ne les peces.',example:'2 files de 3 caselles fan 2 × 3 = 6 caselles. El seu perímetre és 3 + 2 + 3 + 2 = 10 costats de casella.'},{title:'El mosaic que es repeteix',text:'Cada fila repeteix: verd, blanc, verd, blanc. Pinta només les caselles que han de ser verdes.',cols:4,rows:3,fixed:[],target:[0,2,4,6,8,10],rule:'Un patró es construeix repetint un mateix grup en el mateix ordre.',example:'El grup verd-blanc ocupa 2 caselles. El repetim 2 cops a cada fila de 4.'}];
let tiles=new Set();function puzzle(n){tiles=new Set();gameSolved=false;const p=puzzles[n];main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">🧩 TALLER · REPTE ${n+1}/3</span><h1>${p.title}</h1><section class="panel"><p>${p.text}</p><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;max-width:340px;margin:24px auto">${Array.from({length:p.cols*p.rows},(_,i)=>{const fixed=n===0&&i%4<2;return `<button class="tile ${p.fixed?.includes(i)?'painted':''}" style="${n===0&&i%4===1?'border-right:5px solid #e79031;':''}" ${fixed?'disabled':''} data-tile="${i}" aria-label="Fila ${Math.floor(i/4)+1}, columna ${i%4+1}${fixed?', model':''}" aria-pressed="${p.fixed?.includes(i)?'true':'false'}">${fixed?'◆':'·'}</button>`}).join('')}</div><button class="hint" id="puzzlehint">💡 Una pista</button> <button class="primary" id="checkgame">Comprovar</button><div id="gamefeedback" aria-live="polite"></div></section></div>`;document.querySelectorAll('[data-tile]').forEach(b=>b.onclick=()=>{if(gameSolved)return;const i=+b.dataset.tile;tiles.has(i)?tiles.delete(i):tiles.add(i);b.classList.toggle('painted',tiles.has(i));b.setAttribute('aria-pressed',tiles.has(i))});document.querySelector('#puzzlehint').onclick=()=>document.querySelector('#gamefeedback').textContent=n===0?'💡 Mira cada fila: la casella que toca el mirall té la seva parella just a l’altre costat.':n===1?'💡 Necessites sis caselles: dues files seguides amb tres caselles seguides cadascuna.':'💡 A cada fila, pinta la primera i la tercera casella.';document.querySelector('#checkgame').onclick=()=>{if(gameSolved)return;let ok;if(n===1){const a=[...tiles],rs=a.map(i=>Math.floor(i/4)),cs=a.map(i=>i%4);ok=a.length===6&&Math.max(...rs)-Math.min(...rs)===1&&Math.max(...cs)-Math.min(...cs)===2}else ok=tiles.size===p.target.length&&p.target.every(i=>tiles.has(i));if(!ok){document.querySelector('#gamefeedback').textContent='Encara falta algun detall. Revisa el dibuix o demana una pista i torna-ho a provar.';return}gameSolved=true;state.done['puzzle-'+n]=true;save();document.querySelector('#gamefeedback').innerHTML=learning(p.rule,p.example)+`<button class="primary" onclick="${n<2?'puzzle('+(n+1)+')':'home()'}">${n<2?'Següent mosaic →':'Tornar a l’illa →'}</button>`};window.scrollTo(0,0)}
function guide(){main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">💡 SEMPRE QUE ET CALGUI</span><h1>El racó de pistes</h1><p>Obre una capsa i descobreix una manera de pensar-ho.</p>${zones.map((z,i)=>`<details class="panel" style="margin-bottom:14px"><summary>${z.icon} ${z.title}</summary>${lessons[i].map(l=>learning(...l)).join('')}</details>`).join('')}</div>`;window.scrollTo(0,0)}


let dailyMode=false,dailyStep=0;
function localDay(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function dailySet(day){const seed=Number(day.replaceAll('-',''));return Array.from({length:3},(_,i)=>[(seed+i*2)%zones.length,(Math.floor(seed/7)+i)%zones[(seed+i*2)%zones.length].q.length])}
let dailyDate='';
function daily(){dailyMode=true;dailyDate=localDay();state.daily ||= {};state.daily[dailyDate] ||= [];dailyStep=0;dailyQuestion()}
function dailyQuestion(){if(dailyStep===3){dailyMode=false;main.innerHTML=`<div class="play panel reward"><div class="big">🌟</div><h1>Aventura del dia completada!</h1><p>Has descobert tres maneres de pensar les matemàtiques. Demà t’espera una altra combinació!</p><p>Pots repetir-la sempre que vulguis, al teu ritme.</p><button class="primary" onclick="garden()">Visitar el meu jardí →</button><button class="back" onclick="home()">Tornar al mapa</button></div>`;return}const [z,q]=dailySet(dailyDate)[dailyStep];active=z;round=[q];step=0;question();document.querySelector('.eyebrow').textContent=`🗺️ AVENTURA DEL DIA · ${dailyStep+1}/3`;document.querySelector('#daily-status').textContent=`Tres reptes de zones diferents · ${dailyDate.split('-').reverse().join('/')}`}
const homeActivities=[
{title:'La taula misteriosa',icon:'📏',materials:'Una cinta mètrica, paper i llapis.',steps:['Tria una taula rectangular. Abans de mesurar, estima quant fan el llarg i l’ample.','Mesura els dos costats en centímetres i apunta’ls.','Suma llarg + ample + llarg + ample per trobar el perímetre.'],rule:'El perímetre és la longitud de tot el contorn. Mesurem tots els costats en la mateixa unitat.',example:'Una taula de 80 cm per 60 cm té un perímetre de 280 cm.'},
{title:'Un berenar ben repartit',icon:'🍪',materials:'12 peces petites: fitxes, taps o galetes.',steps:['Fes tres grups iguals amb les 12 peces. Quantes en té cadascun?','Torna-les a ajuntar i fes quatre grups iguals.','Explica què és un terç de 12 i què és un quart de 12.'],rule:'Trobar un terç és dividir en 3 grups iguals; trobar un quart és dividir en 4.',example:'Un terç de 12 és 4. Un quart de 12 és 3.'},
{title:'La botiga de casa',icon:'🪙',materials:'Paper, llapis i monedes de paper.',steps:['Dibuixa tres objectes i posa’ls preus d’1 €, 2 € i 3 €.','Tria dos objectes i calcula quant costen junts.','Paga amb un bitllet de paper de 10 € i prepara el canvi. Comprova que compra + canvi = 10 €.'],rule:'El canvi es calcula restant el cost de la compra als diners amb què paguem.',example:'Si compres objectes de 2 € i 3 €, el total és 5 € i el canvi de 10 € és 5 €.'},
{title:'Caçadora de simetries',icon:'🦋',materials:'Un full i llapis de colors.',steps:['Plega el full per la meitat i torna’l a obrir: el plec serà l’eix.','Dibuixa tres quadradets a un costat del plec.','Copia’ls a l’altre costat, a la mateixa distància. Plega el full per comprovar si coincideixen.'],rule:'Dues parts són simètriques quan coincideixen en plegar-les per l’eix.',example:'Un punt a 2 cm de l’eix té la seva parella a 2 cm a l’altre costat.'},
{title:'El rellotge de la tarda',icon:'⏰',materials:'Un rellotge i paper.',steps:['Apunta l’hora en què comences una activitat de casa.','Imagina que dura 25 minuts: a quina hora acabaràs?','Comprova-ho amb salts de 5 minuts. Recorda que després del minut 59 comença una altra hora.'],rule:'Per calcular una hora final, sumem la durada; cada 60 minuts completem una hora.',example:'Si comences a les 17:45 i passen 25 minuts, acabes a les 18:10.'},
{title:'L’enquesta de les fruites',icon:'📊',materials:'Paper, colors i persones de casa.',steps:['Pregunta a les persones de casa quina fruita prefereixen entre poma, plàtan i pera. Cadascuna tria una opció.','Dibuixa una columna per fruita i un quadrat per cada vot.','Quina té més vots? Quants vots hi ha en total? Si hi ha empat, explica-ho.'],rule:'Un gràfic representa dades. La mateixa marca ha de valer el mateix a totes les columnes.',example:'Amb 2 vots de poma, 1 de plàtan i 1 de pera, hi ha 4 vots en total.'}
];
function atHome(){dailyMode=false;main.innerHTML=`<button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">🏡 DESCOBREIX FORA DE LA PANTALLA</span><h1>Matemàtiques a casa</h1><p>Tria una missió de 5–10 minuts. Prepara el material, allunya’t de la pantalla i torna per explicar què has descobert. Pots demanar ajuda a una persona gran.</p><div class="grid">${homeActivities.map((a,i)=>`<button class="card" onclick="homeActivity(${i})"><span class="icon">${a.icon}</span><h3>${a.title}</h3><p>${a.materials}</p><span class="tag">${state.homeDone?.[i]?'🌼 Ja l’has explorat · Repetir':'Començar la missió →'}</span></button>`).join('')}</div>`;window.scrollTo(0,0)}
function homeActivity(i){const a=homeActivities[i];main.innerHTML=`<div class="play"><button class="back" onclick="atHome()">← Activitats de casa</button><span class="eyebrow">🏡 MISSIÓ SENSE PANTALLA</span><h1>${a.icon} ${a.title}</h1><section class="panel"><h3>Què necessites?</h3><p>${a.materials}</p><ol>${a.steps.map(t=>`<li style="margin-bottom:16px;line-height:1.6">${t}</li>`).join('')}</ol><p>Quan hagis acabat, explica en veu alta què has descobert i com ho has comprovat.</p><label><input type="checkbox" id="home-check"> Ho he fet i he explicat la meva descoberta.</label><p><button class="primary" id="home-finish">Compartir la descoberta 🌱</button></p><div id="home-feedback" aria-live="polite"></div></section></div>`;document.querySelector('#home-finish').onclick=()=>{if(!document.querySelector('#home-check').checked){document.querySelector('#home-feedback').textContent='Primer fes l’activitat i explica la teva descoberta. Després marca la casella.';return}state.homeDone ||= {};state.homeDone[i]=true;save();document.querySelector('#home-feedback').innerHTML=learning(a.rule,a.example)+'<p>🌼 Has plantat una flor al jardí! Repetir l’activitat ajuda a aprendre; la flor es planta una sola vegada.</p><button class="primary" onclick="garden()">Veure el meu jardí →</button>';document.querySelector('#home-finish').disabled=true};window.scrollTo(0,0)}
function garden(){dailyMode=false;const days=Object.values(state.daily||{}).filter(a=>a.length===3).length,flowers=Object.keys(state.homeDone||{}).length,beds=[['El bosc dels nombres',completed(0),zones[0].q.length,'🌳'],['Les compres',completed(1),zones[1].q.length,'🌻'],['Les fraccions',completed(2),zones[2].q.length,'🌷'],['El temps i les mesures',completed(3),zones[3].q.length,'🌿'],['Les formes',completed(4),zones[4].q.length,'🌺'],['Els patrons',completed(5),zones[5].q.length,'🌵'],['Les dades',completed(6),zones[6].q.length,'🌸'],['La botiga',Object.keys(state.done).filter(k=>k.startsWith('shop-')).length,3,'🍓'],['Els mosaics',Object.keys(state.done).filter(k=>k.startsWith('puzzle-')).length,3,'🌼']];main.innerHTML=`<button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">🌱 CADA DESCOBERTA FA CRÉIXER L’ILLA</span><h1>El meu jardí</h1><p>Cada repte nou fa créixer una planta. Les activitats de casa hi planten flors i les aventures del dia hi porten papallones. El jardí t’espera sempre: no cal jugar cada dia.</p><div class="grid">${beds.map(([name,n,max,icon])=>`<article class="card"><div style="font-size:50px" aria-hidden="true">${n===0?'🟤':n<max/2?'🌱':n<max?'🌿':icon}</div><h3>${name}</h3><p>${n===0?'Una llavor esperant la primera descoberta.':n<max?'La teva planta està creixent!':'La planta ha florit!'} ${n}/${max}</p><progress value="${n}" max="${max}" aria-label="Progrés de ${name}" style="width:100%"></progress></article>`).join('')}</div><section class="panel" style="margin-top:24px"><h2>El racó de les descobertes</h2><p>Flors de casa: ${flowers}/6</p><div style="font-size:36px" aria-label="${flowers} flors">${'🌼'.repeat(flowers)||'🌱'}</div><p>🦋 ${days} ${days===1?'aventura del dia completada':'aventures del dia completades'}</p><p class="muted">Les activitats de casa es marquen com a fetes per tu. Les plantes mostren pràctica i participació, també amb ajuda.</p><button class="pill" onclick="daily()">Aventura del dia</button><button class="pill" onclick="atHome()">Matemàtiques a casa</button></section>`;window.scrollTo(0,0)}

try{localStorage.removeItem('illa-mates-v1')}catch{}
let state;try{state=JSON.parse(localStorage.getItem('illa-mates-v2'))||{done:{},attempts:{}}}catch{state={done:{},attempts:{}}}state.done ||= {};state.attempts ||= {};let active=0,step=0,round=[],solved=false;const main=document.querySelector('main');const key=(z,q)=>`${z}-${q}`;const completed=z=>zones[z].q.filter((_,q)=>state.done[key(z,q)]).length;const total=()=>Object.keys(state.done).length+Object.keys(state.homeDone||{}).length;function save(){try{localStorage.setItem('illa-mates-v2',JSON.stringify(state))}catch{}document.querySelector('#stars').textContent=`⭐ ${total()}`}
function home(){dailyMode=false;save();main.innerHTML=`<section class="hero"><div><span class="eyebrow">LA TEVA AVENTURA MATEMÀTICA · 4T</span><h1>Una illa plena<br>de descobertes.</h1><p>Explora, resol petits reptes i omple l’illa de tresors. La teva pròxima descoberta comença aquí!</p><button class="primary" id="start">Som-hi! Explorem l’illa ↗</button><div class="sub">🌿 Al teu ritme · Amb pistes · Sense presses</div></div><div class="island" role="img" aria-label="Illa amb muntanyes, arbres i un castell"><div class="land"></div><span class="cloud">☁️</span><span class="sun">☀️</span><span class="mount">⛰️</span><span class="tree">🌳</span><span class="house">🏰</span><span class="path">👣</span></div></section><div class="sectionline"><div><span class="eyebrow">TRIA EL TEU DESTÍ</span><h2>El mapa de l’aventura</h2></div><p>${total()} descobertes · Tria on vols explorar</p></div><section class="grid">${destinations().map(destinationCard).join('')}</section>`;document.querySelector('#start').onclick=daily;document.querySelectorAll('[data-zone]').forEach(b=>b.onclick=()=>start(+b.dataset.zone));window.scrollTo(0,0)}
function start(z){dailyMode=false;active=z;step=0;round=zones[z].q.map((_,i)=>i).filter(i=>!state.done[key(z,i)]);if(!round.length)round=zones[z].q.map((_,i)=>i);question()}
function question(){solved=false;const z=zones[active],q=z.q[round[step]];main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><div class="sectionline"><span class="eyebrow">${z.icon} ${z.title}</span><span class="muted">Repte ${step+1} de ${round.length}</span></div><div class="progress"><i style="width:${step/round.length*100}%"></i></div><p class="muted" id="daily-status"></p><section class="panel"><span class="eyebrow">OBSERVA · PENSA · PROVA</span><h2 class="question">${q[0]}</h2><div class="visual">${q[5]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-answer="${i}">${a}</button>`).join('')}</div><button class="hint" id="hint">💡 Una pista, si us plau</button><div id="feedback" aria-live="polite"></div><div id="next"></div></section><p class="muted">🌱 Equivocar-se també és descobrir. Pots tornar-ho a provar.</p></div>`;document.querySelector('#hint').onclick=()=>{document.querySelector('#feedback').innerHTML=`<div class="feedback">💡 ${q[4]}</div>`};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,b));window.scrollTo(0,0)}
function answer(a,b){if(solved)return;const id=key(active,round[step]),q=zones[active].q[round[step]];state.attempts[id]=(state.attempts[id]||0)+1;if(a!==q[2]){b.classList.add('wrong');b.disabled=true;document.querySelector('#feedback').innerHTML=`<div class="feedback">Encara no. Provem-ho d’una altra manera: ${q[4]}</div>`;save();return}solved=true;b.classList.add('correct');state.done[id]=true;if(dailyMode){state.daily ||= {};state.daily[dailyDate] ||= [];if(!state.daily[dailyDate].includes(dailyStep))state.daily[dailyDate].push(dailyStep)}save();document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);document.querySelector('#hint').hidden=true;document.querySelector('#feedback').innerHTML=`<div class="feedback"><strong>✨ Ho has descobert!</strong><br>${q[3]}</div>${learning(...lessons[active][round[step]])}`;document.querySelector('#next').innerHTML='<button class="primary" id="continue">Continuem →</button>';document.querySelector('#continue').onclick=()=>{if(dailyMode){dailyStep++;dailyQuestion();return}step++;step<round.length?question():finish()}}
function finish(){main.innerHTML=`<div class="play panel reward"><div class="big">${zones[active].treasure}</div><span class="eyebrow">UNA NOVA DESCOBERTA</span><h1>Missió completada!</h1><p>Has explorat ${zones[active].title.toLowerCase()} i has aconseguit un tresor per a la teva illa.</p><p>⭐ Ja tens ${total()} descobertes. Pots descansar o triar una altra aventura.</p><button class="primary" onclick="home()">Tornar a l’illa →</button><p><button class="back" onclick="start(active)">Tornar a practicar aquesta zona</button></p></div>`}
function treasures(){dailyMode=false;main.innerHTML=`<button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">LA TEVA COL·LECCIÓ</span><h1>Petites grans descobertes.</h1><p>Cada racó de l’illa té descobertes per col·leccionar. Completa les seves activitats i mira com creix el jardí!</p><div class="grid">${destinations().filter(d=>d.max).map(d=>destinationCard({...d,icon:d.count===d.max?(d.treasure||d.icon):'🔎',desc:d.count===d.max?'Descobertes completades! Pots tornar-hi per practicar.':d.desc})).join('')}</div>`;window.scrollTo(0,0)}
function adults(){main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">PER ACOMPANYAR L’AVENTURA</span><h1>Aprendre amb confiança.</h1><div class="panel"><h2>Què estem treballant?</h2><p>L’illa combina reptes, compres, mosaics i activitats quotidianes per practicar els sabers de matemàtiques de 3r–4t de primària del Departament d’Educació. Cada activitat ofereix pistes i una explicació per consolidar l’aprenentatge.</p><p>El sentit socioemocional és transversal: pistes disponibles, nous intents i absència de temps límit. Les estrelles indiquen reptes resolts, també amb ajuda; no certifiquen el domini autònom.</p><table><thead><tr><th>Zona</th><th>Resolts</th><th>Intents</th></tr></thead><tbody>${destinations().filter(d=>d.max).map(d=>`<tr><td>${d.icon} ${d.title}</td><td>${d.count}/${d.max}</td><td>${d.zone!==undefined?zones[d.zone].q.reduce((s,_,j)=>s+(state.attempts[key(d.zone,j)]||0),0):'—'}</td></tr>`).join('')}</tbody></table><p>Després de cada repte apareix «Què hem après?» amb una idea clau i un exemple. El racó de pistes permet repassar-les.</p><p>L’aventura del dia reutilitza tres reptes de zones diferents i canvia segons la data del dispositiu. Les sis missions de casa es marquen com a fetes per la jugadora. El jardí representa la pràctica acumulada, sense ratxes ni penalitzacions.</p><h3>Com acompanyar-la</h3><p>Proposeu una zona en sessions de 5–10 minuts. Demaneu-li que expliqui com ho ha pensat i utilitzeu monedes, paper o peces reals quan li vagi bé. El nombre d’intents inclou les repeticions dels reptes.</p><h3>Fonts oficials</h3><p><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/curriculum-175-2022/Matematiques.pdf" target="_blank" rel="noopener">Currículum de matemàtiques de primària ↗</a><br><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/concrecions-curriculars/Orientacions-curriculars_MAT_PRI_per-cursos.pdf" target="_blank" rel="noopener">Orientacions curriculars: proposta per cursos ↗</a></p><p class="muted">El progrés es guarda només en aquest navegador. No cal nom ni compte. Si canvieu de dispositiu o esborreu les dades del navegador, aquest progrés no hi serà.</p><button class="hint" id="reset">Reiniciar el progrés…</button><div id="reset-confirm"></div></div></div>`;document.querySelector('#reset').onclick=()=>{document.querySelector('#reset-confirm').innerHTML='<p>S’esborraran totes les estrelles i els intents d’aquest navegador.</p><button class="pill" id="yesreset">Sí, esborrar el progrés</button><button class="pill" id="cancelreset">Cancel·lar</button>';document.querySelector('#yesreset').onclick=()=>{state={done:{},attempts:{}};save();adults()};document.querySelector('#cancelreset').onclick=()=>document.querySelector('#reset-confirm').innerHTML=''}}
document.querySelector('#brand').onclick=e=>{e.preventDefault();home()};document.querySelector('#mapnav').onclick=home;document.querySelector('#collection').onclick=treasures;document.querySelector('#adults').onclick=adults;home();
</script></body></html>
