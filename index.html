", "Busca una superfície corba sense cares planes.", "⚽ 🎲 🥫 📦", "Una esfera és un cos amb superfície corba, sense vèrtexs."], ["Quin cos s’assembla a una llauna?", ["Cub", "Con", "Esfera", "Cilindre"], 3, "Una llauna té dues bases circulars i una superfície lateral corba.", "Mira la forma de les dues bases.", "🥫", "Un cilindre té dues bases circulars iguals i paral·leles."], ["Quants vèrtexs té un rectangle?", ["3", "4", "5", "6"], 1, "Té quatre cantonades, és a dir, quatre vèrtexs.", "Compta on s’ajunten els costats.", "▭", "Un vèrtex és un punt on es troben dos costats d’un polígon."], ["Fas mitja volta. Quants graus has girat?", ["90°", "360°", "180°", "45°"], 2, "Mitja volta és 360 ÷ 2 = 180°.", "És la meitat d’una volta sencera.", "↑ → ↓", "Mitja volta equival a dos angles rectes."], ["Quin angle és més petit que un angle recte?", ["45°", "90°", "180°", "360°"], 0, "45° és més petit que 90°. És un angle agut.", "L’angle recte té 90°.", "45° · 90° · 180° · 360°", "Els angles aguts són més petits que 90°."], ["Quin parell de línies no es troba encara que les allarguem?", ["Perpendiculars", "Secants", "Corbes que es creuen", "Paral·leles"], 3, "Les línies paral·leles mantenen la mateixa separació i no es tallen.", "Pensa en els dos rails rectes d’una via.", "∥", "Dues rectes paral·leles no tenen cap punt en comú."], ["Com es diuen dues rectes que es tallen fent un angle recte?", ["Paral·leles", "Perpendiculars", "Diagonals", "Horitzontals"], 1, "Les rectes perpendiculars formen angles de 90°.", "Pensa en una cantonada quadrada.", "⊥", "La perpendicularitat descriu rectes que es tallen formant angles rectes."], ["Un rectangle no quadrat té quants eixos de simetria?", ["1", "4", "2", "0"], 2, "En té dos: un travessa els punts mitjans dels costats llargs i l’altre, dels curts.", "Les diagonals no fan coincidir les meitats d’un rectangle no quadrat.", "▭", "La simetria depèn de la forma: no tots els quadrilàters tenen els mateixos eixos."], ["Un mosaic té 3 files de 4 quadradets. Quants quadradets té?", ["12", "7", "10", "14"], 0, "3 × 4 = 12 quadradets.", "Compta quatre peces per cada fila.", "□□□□\n□□□□\n□□□□", "Comptar quadrats iguals permet mesurar una superfície amb unitats quadrades."], ["Un cub té quants vèrtexs?", ["4", "6", "12", "8"], 3, "Un cub té quatre vèrtexs a la cara de dalt i quatre a la de baix: vuit.", "Imagina les cantonades d’un dau.", "🎲", "Els cossos geomètrics es poden descriure per cares, arestes i vèrtexs."], ["En una quadrícula ets a (2, 3). Avances 2 caselles cap a la dreta. On arribes?", ["(2, 5)", "(4, 3)", "(0, 3)", "(3, 4)"], 1, "La primera coordenada augmenta de 2 a 4; la segona continua sent 3.", "La primera coordenada indica la posició horitzontal.", "(columna, fila): (2, 3) →→", "Les coordenades permeten situar punts en una quadrícula."], ["Tens un quadrat i el gires un quart de volta. Quina figura és ara?", ["Un triangle", "Un rectangle no quadrat", "Un quadrat", "Un pentàgon"], 2, "Continua sent un quadrat: el gir no canvia els costats ni els angles.", "Canvia l’orientació, però no la forma.", "□ ↻ 90°", "Un gir conserva la forma i la mida d’una figura."]], [["Continua la sèrie: 5, 10, 15, 20…", ["25", "30", "24", "21"], 0, "Sumem 5 cada vegada; 20 + 5 = 25.", "Compara dos nombres consecutius.", "5 → 10 → 15 → 20 → ?", "Una sèrie pot créixer amb un salt constant."], ["Quin nombre falta: 90, 80, 70, □, 50?", ["65", "55", "60", "40"], 2, "Restem 10 cada vegada; després de 70 ve 60.", "La sèrie va cap enrere.", "90 → 80 → 70 → □ → 50", "Les sèries també poden ser decreixents."], ["Continua: 2, 4, 8, 16…", ["18", "32", "24", "20"], 1, "Cada terme és el doble de l’anterior: 16 × 2 = 32.", "No sumem sempre el mateix: doblem.", "2 → 4 → 8 → 16 → ?", "Una regla de multiplicació també pot generar una sèrie."], ["Quin nombre falta a □ − 8 = 15?", ["7", "15", "22", "23"], 3, "23 − 8 = 15. Ho trobem amb 15 + 8 = 23.", "Desfés la resta sumant 8.", "□ − 8 = 15", "La suma i la resta són operacions inverses omprovem: 8 × 3 = 24.", "Desfés la multiplicació amb una divisió.", "? → [×3] → 24", "Podem trobar una entrada desconeguda aplicant l’operació inversa."], ["Quina igualtat és certa?", ["8 + 4 = 6 + 6", "8 + 4 = 8 + 6", "8 + 4 = 7 + 4", "8 + 4 = 5 + 5"], 0, "8 + 4 = 12 i 6 + 6 = 12.", "Calcula el valor dels dos costats.", "⚖️ Dos costats, un mateix valor", "El signe igual relaciona expressions amb el mateix valor."], ["Quantes passes fa el robot si repeteix 5 cops un grup de 3 passes?", ["8", "10", "15", "20"], 2, "5 × 3 = 15 passes.", "Pots sumar 3 cinc vegades.", "🤖 [→→→] × 5", "Un bucle repeteix una mateixa seqüència d’instruccions."], ["Segueix la regla: 1, 4, 7, 10… Quin és el sisè nombre?", ["13", "16", "15", "19"], 1, "El cinquè és 13 i el sisè és 16, perquè sumem 3.", "Continua dos salts més des del 10.", "1, 4, 7, 10, □, ?", "Per trobar un terme, cal seguir la regla i comptar bé la seva posició."]], [["Quina fruita ha rebut més vots?", ["Poma", "Pera", "Plàtan", "Totes igual"], 2, "El plàtan té 6 vots, més que la poma (4) i la pera (3).", "Compara les tres quantitats.", "Poma ▰▰▰▰\nPera ▰▰▰\nPlàtan ▰▰▰▰▰▰\nCada ▰ = 1 vot", "La categoria més freqüent és la que té més observacions."], ["Cada bloc del gràfic val 2 ocells. Quants ocells representen 4 blocs?", ["8", "4", "6", "10"], 0, "4 blocs × 2 ocells per bloc = 8 ocells.", "Llegeix quant val cada bloc abans de comptar.", "Ocells ▰▰▰▰\nCada ▰ = 2 ocells", "Cal llegir la llegenda o escala d’un gràfic."], ["Dilluns es llegeixen 8 pàgines i dimarts 12. Quantes més es llegeixen dimarts?", ["20", "2", "6", "4"], 3, "12 − 8 = 4 pàgines més.", "La pregunta demana una diferència.", "Dilluns: 8 · Dimarts: 12", "Per comparar dades, sovint restem la quantitat menor de la major."], ["Una enquesta té 5 vots de gat, 3 de gos i 2 de conill. Quantes persones han votat si cadascuna vota un cop?", ["8", "10", "12", "15"], 1, "5 + 3 + 2 = 10 persones.", "Suma els vots de totes les opcions.", "🐱 5 · 🐶 3 · 🐰 2", "Si cada persona function trackedAnswer(response,correct,correctAnswer){if(!tracking)return;tracking.attempt++;appendLearning('answer',{response,correct,correctAnswer,hintUsed:tracking.hints>0,helpUsed:tracking.hints>0||tracking.feedbackGiven,attemptInSession:tracking.attempt,attemptForActivity:learningLog.events.filter(e=>e.type==='answer'&&e.activityId===tracking.activityId).length+1});if(!correct)tracking.feedbackGiven=true}

meSolved)return;const cost=m.items.reduce((t,i,j)=>t+i[1]*counts[j],0);trackedAnswer({quantities:[...counts],changeCents:coins},counts.every((v,j)=>v===m.items[j][2])&&coins===m.pay-cost,{quantities:m.items.map(i=>i[2]),costCents:m.items.reduce((t,i)=>t+i[1]*i[2],0),changeCents:m.pay-m.items.reduce((t,i)=>t+i[1]*i[2],0)});if(counts.some((v,j)=>v!==m.items[j][2])){document.querySelector('#gamefeedback').textContent='Mira la llista: comprova quantes unitats necessites de cada producte.';return}if(coins!==m.pay-cost){document.querySelector('#gamefeedback').textContent='El cistell és correcte! Ara revisa el canvi: compra + canvi han de sumar el que pagues.';return}gameSolved=true;state.done[draftKey('shop',shopDay,n)]=true;save();document.querySelector('#gamefeedback').innerHTML=learning('Primer multipliquem el preu per les unitats, sumem la compra i restem per trobar el canvi.',`${m.items.map(i=>`${i[2]} × ${money(i[1])}`).join(' + ')} = ${money(cost)}. Canvi: ${money(m.pay)} − ${money(cost)} = ${money(coins)}.`)+`<button class="primary" onclick="${n<2?'shop('+(n+1)+')':'home()'}">${n<2?'Següent compra →':'Tornar a l’illa →'}</button>`};window.scrollTo(0,0)}

function makePuzzles(day){const d=dayNumber(day),r=dailyRandom(day,29),cols=4+2*(d%2),rows=4,fixed=[],target=[];for(let row=0;row<rows;row++)for(let col=0;col<cols/2;col++){if(r()>.45){fixed.push(row*cols+col);target.push(row*cols+cols-1-col)}}if(!fixed.length){fixed.push(0);target.push(cols-1)}const w=2+d%3,h=2+Math.floor(d/3)%2,period=2+d%2,offset=d%period,patternTarget=[];for(let i=0;i<18;i++)if((i%6)%period===offset)patternTarget.push(i);return [{title:'El mirall del mosaic',text:'La línia central és un mirall. Pinta la meitat dreta perquè reflecteixi la meitat esquerra.',cols,rows,fixed,target,hint:'Cada casella té la seva parella a la mateixa distància del mirall.',rule:'En una simetria, cada peça queda a la mateixa distància de l’eix, a l’altra banda.',example:'En aquest tauler, la columna 1 es reflecteix a la '+cols+' i la 2 a la '+(cols-1)+'.'}, {title:'Un jardí rectangular',text:'Pinta un rectangle de '+w+' columnes i '+h+' files, en qualsevol lloc del tauler.',cols:6,rows:5,w,h,hint:'Pinta '+h+' files seguides amb '+w+' caselles seguides a cada fila.',rule:'Comptem la superfície amb caselles i el perímetre amb els costats del contorn.',example:h+' × '+w+' = '+(h*w)+' caselles. Perímetre: '+w+' + '+h+' + '+w+' + '+h+' = '+(2*w+2*h)+' costats de casella.'},{title:'El mosaic que es repeteix',text:'Repeteix aquest grup a cada fila: '+Array.from({length:period},(_,i)=>i===offset?'verd':'blanc').join(', ')+'. Pinta només les caselles verdes.',cols:6,rows:3,fixed:[],target:patternTarget,hint:'El grup té '+period+' caselles. Comença de nou a cada fila.',rule:'Un patró repeteix un mateix grup en el mateix ordre.',example:'Cada fila té 6 caselles: el grup de '+period+' es repeteix '+(6/period)+' vegades.'}]}

let ok;if(n===1){const a=[...tiles],rs=a.map(i=>Math.floor(i/p.cols)),cs=a.map(i=>i%p.cols);ok=a.length===p.w*p.h&&Math.max(...rs)-Math.min(...rs)===p.h-1&&Math.max(...cs)-Math.min(...cs)===p.w-1}else ok=tiles.size===p.target.length&&p.target.every(i=>tiles.has(i));trackedAnswer({paintedCells:[...tiles].sort((a,b)=>a-b)},ok,n===1?{columns:p.w,rows:p.h,anyPosition:true}: {paintedCells:p.target});if(!ok){document.querySelector('#gamefeedback').textContent='Encara falta algun detall. Revisa el dibuix o demana una pista i torna-ho a provar.';return}gameSolved=true;state.done[draftKey('puzzle',puzzleDay,n)]=true;save();document.querySelector('#gamefeedback').innerHTML=learning(p.rule,p.example)+`<button class="primary" onclick="${n<2?'puzzle('+(n+1)+')':'home()'}">${n<2?'Següent mosaic →':'Tornar a l’illa →'}</button>`};window.scrollTo(0,0)}

function home(){dailyMode=false;save();const all=destinations(),games=[all.find(d=>d.action==='daily()'),all.find(d=>d.action==='shop(0)'),all.find(d=>d.action==='puzzle(0)')],house=all.find(d=>d.action==='atHome()');main.innerHTML=`<section class="hero"><div><span class="eyebrow">LA TEVA AVENTURA MATEMÀTICA · 4T</span><h1>Una illa plena<br>de descobertes.</h1><p>Tria un joc, explora una zona o descobreix les matemàtiques que tens a casa. Cada pas fa créixer el teu jardí!</p><div class="sub">🌿 Al teu ritme · Amb pistes · Sense presses</div><div class="island hero-island" role="img" aria-label="Illa amb muntanyes, arbres i un castell"><div class="land"></div><span class="cloud">☁️</span><span class="sun">☀️</span><span class="mount">⛰️</span><span class="tree">🌳</span><span class="house">🏰</span><span class="path">👣</span></div></div><aside class="calendar-box" id="calendar-widget" aria-label="Calendari del progrés diari">${calendarMarkup()}</aside></section><section aria-labelledby="games-heading"><span class="eyebrow">TRIA UNA MANERA DE JUGAR</span><h2 id="games-heading">Una aventura per començar</h2><p class="muted">Tres jocs que es renoven cada dia. Pots reprendre’ls durant el dia; les descobertes es conserven al jardí.</p><div class="grid games">${games.map(d=>`<button class="game-entry ${d.action==='daily()'?'daily-entry':''}" onclick="${d.action}"><span style="font-size:36px" aria-hidden="true">${d.icon}</span><h3>${d.title}</h3><p>${d.desc}</p><strong>${d.count}/${d.max} descobertes · Jugar →</strong></button>`).join('')}</div></section><section aria-labelledby="zones-heading" style="margin-top:44px"><div class="sectionline"><div><span class="eyebrow">EXPLORA CADA CONTINGUT</span><h2 id="zones-heading">Les nou zones de l’illa</h2></div><p>20 reptes per zona · 180 per descobrir</p></div><div class="grid" id="content-zones">${all.filter(d=>d.zone!==undefined).map(destinationCard).join('')}</div></section><section class="home-banner" aria-labelledby="house-heading"><div><span class="eyebrow">DESCOBREIX FORA DE LA PANTALLA</span><h2 id="house-heading">🏡 Matemàtiques a casa</h2><p>Sis missions per mesurar, repartir i investigar amb materials reals. ${house.count}/${house.max} descobertes.</p></div><button class="primary" onclick="atHome()">Triar una missió →</button></section>`;window.scrollTo(0,0)}

function start(z){dailyMode=false;active=z;step=0;round=zones[z].q.map((_,i)=>i).filter(i=>!state.done[key(z,i)]);if(!round.length)round=zones[z].q.map((_,i)=>i);question()}
function question(){solved=false;const z=zones[active],q=z.q[round[step]];beginTracking({activityId:'zone-'+key(active,round[step]),mode:dailyMode?'daily':'zone',challengeDate:dailyMode?dailyDate:null,zone:z.title,skills:[z.topics,lessons[active][round[step]][0]],question:q[0],exercise:{options:[...q[1]],visual:q[5],explanation:q[3]}});main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><div class="sectionline"><span class="eyebrow">${z.icon} ${z.title}</span><span class="muted">Repte ${step+1} de ${round.length}</span></div><div class="progress"><i style="width:${step/round.length*100}%"></i></div><p class="muted" id="daily-status"></p><section class="panel"><span class="eyebrow">OBSERVA · PENSA · PROVA</span><h2 class="question">${q[0]}</h2><div class="visual">${q[5]}</div><div class="answers">${q[1].map((a,i)=>`<button class="answer" data-answer="${i}">${a}</button>`).join('')}</div><button class="hint" id="hint">💡 Una pista, si us plau</button><div id="feedback" aria-live="polite"></div><div id="next"></div></section><p class="muted">🌱 Equivocar-se també és descobrir. Pots tornar-ho a provar.</p></div>`;document.querySelector('#hint').onclick=()=>{trackedHint(q[4]);document.querySelector('#feedback').innerHTML=`<div class="feedback">💡 ${q[4]}</div>`};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>answer(+b.dataset.answer,b));window.scrollTo(0,0)}
function answer(a,b){if(solved)return;const id=key(active,round[step]),q=zones[active].q[round[step]];state.attempts[id]=(state.attempts[id]||0)+1;trackedAnswer({optionIndex:a,text:q[1][a]},a===q[2],{optionIndex:q[2],text:q[1][q[2]]});if(a!==q[2]){b.classList.add('wrong');b.disabled=true;document.querySelector('#feedback').innerHTML=`<div class="feedback">Encara no. Provem-ho d’una altra manera: ${q[4]}</div>`;save();return}solved=true;b.classList.add('correct');state.done[id]=true;if(dailyMode){state.daily ||= {};state.daily[dailyDate] ||= [];if(!state.daily[dailyDate].includes(dailyStep))state.daily[dailyDate].push(dailyStep)}save();document.querySelectorAll('[data-answer]').forEach(x=>x.disabled=true);document.querySelector('#hint').hidden=true;document.querySelector('#feedback').innerHTML=`<div class="feedback"><strong>✨ Ho has descobert!</strong><br>${q[3]}</div>${learning(...lessons[active][round[step]])}`;document.querySelector('#next').innerHTML='<button class="primary" id="continue">Continuem →</button>';document.querySelector('#continue').onclick=()=>{if(dailyMode){dailyStep++;dailyQuestion();return}step++;step<round.length?question():finish()}}
function finish(){main.innerHTML=`<div class="play panel reward"><div class="big">${zones[active].treasure}</div><span class="eyebrow">UNA NOVA DESCOBERTA</span><h1>Missió completada!</h1><p>Has explorat ${zones[active].title.toLowerCase()} i has aconseguit un tresor per a la teva illa.</p><p>⭐ Ja tens ${total()} descobertes. Pots descansar o triar una altra aventura.</p><button class="primary" onclick="home()">Tornar a l’illa →</button><p><button class="back" onclick="start(active)">Tornar a practicar aquesta zona</button></p></div>`}
function treasures(){dailyMode=false;main.innerHTML=`<button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">LA TEVA COL·LECCIÓ</span><h1>Petites grans descobertes.</h1><p>Cada racó de l’illa té descobertes per col·leccionar. Completa les seves activitats i mira com creix el jardí!</p><div class="grid">${destinations().filter(d=>d.max).map(d=>destinationCard({...d,icon:d.count===d.max?(d.treasure||d.icon):'🔎',desc:d.count===d.max?'Descobertes completades! Pots tornar-hi per practicar.':d.desc})).join('')}</div>`;window.scrollTo(0,0)}
function adults(){main.innerHTML=`<div class="play"><button class="back" onclick="home()">← Tornar al mapa</button><span class="eyebrow">PER ACOMPANYAR L’AVENTURA</span><h1>Aprendre amb confiança.</h1><div class="panel"><h2>Què estem treballant?</h2><p>L’illa combina reptes, compres, mosaics i activitats quotidianes per practicar els sabers de matemàtiques de 3r–4t de primària del Departament d’Educació. Cada activitat ofereix pistes i una explicació per consolidar l’aprenentatge.</p><p>El sentit socioemocional és transversal: pistes disponibles, nous intents i absència de temps límit. Les estrelles indiquen reptes resolts, també amb ajuda; no certifiquen el domini autònom.</p><table><thead><tr><th>Zona</th><th>Resolts</th><th>Intents</th></tr></thead><tbody>${destinations().filter(d=>d.max).map(d=>`<tr><td>${d.icon} ${d.title}</td><td>${d.count}/${d.max}</td><td>${d.zone!==undefined?zones[d.zone].q.reduce((s,_,j)=>s+(state.attempts[key(d.zone,j)]||0),0):'—'}</td></tr>`).join('')}</tbody></table><p>Després de cada repte apareix «Què hem après?» amb una idea clau i un exemple. El racó de pistes permet repassar-les.</p><p>Els tres jocs es renoven segons la data del dispositiu. L’aventura selecciona reptes de tres zones, sense repetir-los durant un cicle de 60 dies. La botiga i els mosaics es generen cada dia; es desa l’activitat començada i les recompenses acumulades. El calendari es posa verd amb almenys dos reptes resolts de cadascun dels tres jocs del dia; una estrella indica que s’han completat els nou. Només compta activitats registrades en aquest navegador i no dedueix dates d’activitats anteriors sense data. Les sis missions de casa es marquen com a fetes per la jugadora. El jardí representa la pràctica acumulada, sense ratxes ni penalitzacions.</p><h3>Registre d’aprenentatge</h3><p>Es desen les respostes, les pistes i les comprovacions dels jocs en aquest navegador. El registre conté ${learningLog.events.filter(e=>e.type==='answer').length} respostes des del ${new Date(learningLog.startedAt).toLocaleDateString('ca-ES')}. Les activitats anteriors només conserven el resum de progrés que ja teníem.</p><p>Exporta el fitxer per conservar-lo i revisar-lo amb ChatGPT. Inclou les preguntes, respostes, ajudes, dates i el progrés. No s’envia automàticament a cap servei.</p><p class="muted">${logWarning||'El registre és local: es pot perdre si esborres les dades del navegador. Reiniciar les estrelles no esborra aquest registre.'}</p><button class="primary" onclick="exportLearning()">Descarregar registre d’aprenentatge (JSON)</button><p id="export-status" aria-live="polite"></p><button class="back" id="delete-log">Esborrar només el registre…</button><div id="delete-log-confirm"></div><h3>Com acompanyar-la</h3><p>Proposeu uns quants reptes en sessions de 5–10 minuts; no cal completar una zona sencera d’una tirada. El progrés permet reprendre-la més endavant. Demaneu-li que expliqui com ho ha pensat i utilitzeu monedes, paper o peces reals quan li vagi bé. El nombre d’intents inclou les repeticions dels reptes.</p><h3>Fonts oficials</h3><p><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/curriculum-175-2022/Matematiques.pdf" target="_blank" rel="noopener">Currículum de matemàtiques de primària ↗</a><br><a href="https://xtec.gencat.cat/web/.content/curriculum/primaria/concrecions-curriculars/Orientacions-curriculars_MAT_PRI_per-cursos.pdf" target="_blank" rel="noopener">Orientacions curriculars: proposta per cursos ↗</a></p><p class="muted">El progrés es guarda només en aquest navegador. No cal nom ni compte. Si canvieu de dispositiu o esborreu les dades del navegador, aquest progrés no hi serà.</p><button class="hint" id="reset">Reiniciar el progrés…</button><div id="reset-confirm"></div></div></div>`;document.querySelector('#delete-log').onclick=()=>{document.querySelector('#delete-log-confirm').innerHTML='<p>Les respostes detallades s’esborraran. Exporta-les abans si les vols conservar.</p><button class="pill" onclick="deleteLearningLog()">Sí, esborrar el registre</button><button class="pill" onclick="adults()">Cancel·lar</button>'};document.querySelector('#reset').onclick=()=>{document.querySelector('#reset-confirm').innerHTML='<p>S’esborraran totes les estrelles i els intents d’aquest navegador.</p><button class="pill" id="yesreset">Sí, esborrar el progrés</button><button class="pill" id="cancelreset">Cancel·lar</button>';document.querySelector('#yesreset').onclick=()=>{state={done:{},attempts:{}};save();adults()};document.querySelector('#cancelreset').onclick=()=>document.querySelector('#reset-confirm').innerHTML=''}}
document.querySelector('#brand').onclick=e=>{e.preventDefault();home()};document.querySelector('#mapnav').onclick=home;document.querySelector('#collection').onclick=treasures;document.querySelector('#adults').onclick=adults;home();if(!learningLog.baselineProgress)learningLog.baselineProgress=JSON.parse(JSON.stringify(state));persistLog();
</script></body></html>
